<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helmet Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        input[type="file"] {
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        #result-image {
            max-width: 100%;
            margin-top: 20px;
            border: 2px solid #ccc;
            border-radius: 8px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Helmet Detection</h1>
        <p>Upload a traffic image to detect if riders are wearing a helmet.</p>
        <input type="file" id="image-upload" accept="image/*">
        <button id="detect-button">Detect Helmet</button>
        <div class="loader" id="loader"></div>
        <img id="result-image" src="" alt="Detection result will appear here.">
    </div>

    <script>
        document.getElementById('detect-button').addEventListener('click', () => {
            const fileInput = document.getElementById('image-upload');
            const file = fileInput.files[0];
            const resultImage = document.getElementById('result-image');
            const loader = document.getElementById('loader');
            
            if (!file) {
                alert('Please select an image first!');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            // Show loader and hide previous result
            loader.style.display = 'block';
            resultImage.style.display = 'none';

            fetch('/detect', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (response.ok) {
                    return response.blob();
                } else {
                    return response.json().then(err => { throw new Error(err.error); });
                }
            })
            .then(imageBlob => {
                const imageUrl = URL.createObjectURL(imageBlob);
                resultImage.src = imageUrl;
                resultImage.style.display = 'block';
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error detecting helmets: ' + error.message);
            })
            .finally(() => {
                loader.style.display = 'none';
            });
        });
    </script>
</body>
</html>
